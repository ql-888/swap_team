/**:
  ros__parameters:
    # AprilRobotics tag36h11; apriltag_ros omits the "tag" prefix.
    family: 36h11
    size: 0.018
    max_hamming: 0
    image_transport: raw
    qos_profile: sensor_data
    pose_estimation_method: pnp

    detector:
      threads: 2
      decimate: 1.0
      blur: 0.0
      refine: true
      sharpening: 0.25
      debug: false

    # Use a Gemini-specific child frame so the two cameras never publish
    # different parents for the same AprilTag TF child.
    tag:
      ids: [0]
      frames: [gemini_apriltag_0]
      sizes: [0.018]
