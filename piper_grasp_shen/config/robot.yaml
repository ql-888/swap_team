robot:
  can_interface: can0
  model: piper_x
  urdf: assets/piper_x_description/urdf/piper_x_with_gripper_description.urdf
  tcp:
    # Measured after installing the force sensor and remounted gripper.
    # Pivot: X/Y=0 mm, Z=198 mm. Tool-axis yaw: +48.2 degrees.
    parent_frame: flange_link
    xyz_m: [0.0, 0.0, 0.198]
    rpy_deg: [0.0, 0.0, 48.2]

ik:
  control_period_s: 0.02
  position_cost: 1.0
  orientation_cost: 0.2
  posture_cost: 0.001
  position_tolerance_m: 0.001
  orientation_tolerance_deg: 1.0
  random_seed_count: 12

safety:
  speed_percent: 10
  maximum_joint_step_deg: 0.5
  minimum_feedback_hz: 5.0
  execution_timeout_s: 20.0
  workspace_radius_m: 0.65
  minimum_tcp_z_m: 0.02

grasp:
  pregrasp_distance_m: 0.10
  retreat_distance_m: 0.10
  axial_angles_deg: [-90, -60, -30, 0, 30, 60, 90]
  gripper_opening_m: 0.07
  gripper_closed_m: 0.0
